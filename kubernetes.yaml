            - name: WALLET_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: WALLET_DB_PASSWORD
            - name: ConnectionStrings__WalletDb
              value: "Server=mysql-wallet;Port=3306;Database=wallet_db;User=wallet_app;Password=$(WALLET_DB_PASSWORD)"
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: RABBITMQ_USER
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
