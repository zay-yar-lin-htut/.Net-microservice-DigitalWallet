# ============================================================
# Digital Wallet - Kubernetes Starter Manifests
# Namespace, shared settings, Secrets, application Deployments,
# Services, MySQL StatefulSets, RabbitMQ and Seq.
#
# IMPORTANT:
# 1. Replace registry.example.com/... with your real pushed image names.
# 2. Replace every CHANGE_ME value before applying this file.
# 3. This is a learning/starter setup, not a production security setup.
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: digital-wallet
---
# Shared non-secret settings used by the .NET services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallet-config
  namespace: digital-wallet
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  Jwt__Issuer: "DigitalWallet.Identity"
  Jwt__Audience: "DigitalWallet.Services"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RabbitMQ__HostName: "rabbitmq"
  RabbitMQ__Port: "5672"
  WalletService__BaseUrl: "http://wallet-service:8040/"
  DB_PORT: "3306"
---
# Demo secrets. In real projects, do not commit real passwords to Git.
apiVersion: v1
kind: Secret
metadata:
  name: wallet-secrets
  namespace: digital-wallet
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
  INTERNAL_SERVICE_KEY: "CHANGE_ME_INTERNAL_SERVICE_KEY"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_ROOT_PASSWORD"
  IDENTITY_DB_PASSWORD: "CHANGE_ME_IDENTITY_PASSWORD"
  WALLET_DB_PASSWORD: "CHANGE_ME_WALLET_PASSWORD"
  TRANSFER_DB_PASSWORD: "CHANGE_ME_TRANSFER_PASSWORD"
  LEDGER_DB_PASSWORD: "CHANGE_ME_LEDGER_PASSWORD"
  RABBITMQ_USER: "walletapp"
  RABBITMQ_PASSWORD: "CHANGE_ME_RABBITMQ_PASSWORD"
---
# -------------------------
# MySQL: Identity database
# -------------------------
apiVersion: v1
kind: Service
metadata:
  name: mysql-identity
  namespace: digital-wallet
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: mysql-identity
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-identity
  namespace: digital-wallet
spec:
  serviceName: mysql-identity
  replicas: 1
  selector:
    matchLabels:
      app: mysql-identity
  template:
    metadata:
      labels:
        app: mysql-identity
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: identity_db
            - name: MYSQL_USER
              value: identity_app
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: IDENTITY_DB_PASSWORD
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
