# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Realtime Service သို့ ချိတ်ဆက်ရန် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: realtime-service
  # Service အမည်ကို "realtime-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # Port စာရင်းဖြစ်ပါသည်။
    - name: http
      # Port အမည် "http" ဖြစ်ပါသည်။
      port: 8090
      # Service ၏ port နံပါတ် 8090 ဖြစ်ပါသည်။
      targetPort: 8090
      # Container ၏ port နံပါတ် 8090 သို့ ပို့ပေးပါမည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: realtime-service
