    # "app: mysql-transfer" label ပါသော Pod သို့ ပို့ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# StatefulSet အတွက် apps/v1 API ကို သုံးပါသည်။
kind: StatefulSet
# Transfer Database အတွက် StatefulSet အမျိုးအစားဖြစ်ပါသည်။
metadata:
# StatefulSet ၏ အချက်အလက်များဖြစ်ပါသည်။
  name: mysql-transfer
  # အမည်ကို "mysql-transfer" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace အတွင်း ထားရှိပါမည်။
spec:
# StatefulSet သတ်မှတ်ချက်များဖြစ်ပါသည်။
  serviceName: mysql-transfer
  # သက်ဆိုင်ရာ Service အမည်မှာ "mysql-transfer" ဖြစ်ပါသည်။
  replicas: 1
  # Pod အရေအတွက် ၁ ခု ထားရှိပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: mysql-transfer
      # "app: mysql-transfer" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: mysql-transfer
        # "app: mysql-transfer" label တပ်ဆင်ပါသည်။
    spec:
    # Pod အတွင်းရှိ Container သတ်မှတ်ချက်ဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: mysql
          # Container အမည် "mysql" ဖြစ်ပါသည်။
          image: mysql:8.4
          # MySQL 8.4 image ကို အသုံးပြုပါသည်။
          ports:
          # Port သတ်မှတ်ချက်ဖြစ်ပါသည်။
            - name: mysql
              # Port အမည် "mysql" ဖြစ်ပါသည်။
              containerPort: 3306
              # Port 3306 ဖွင့်ထားပါသည်။
          env:
          # Environment Variable များဖြစ်ပါသည်။
            - name: MYSQL_ROOT_PASSWORD
              # Root password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret မှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: MYSQL_ROOT_PASSWORD
                  # "MYSQL_ROOT_PASSWORD" key ကို ယူသုံးပါမည်။
            - name: MYSQL_DATABASE
              # တည်ဆောက်မည့် Database အမည် variable ဖြစ်ပါသည်။
              value: transfer_db
              # Database အမည်ကို "transfer_db" ဟု သတ်မှတ်ပါသည်။
            - name: MYSQL_USER
              # အသုံးပြုမည့် User အမည် variable ဖြစ်ပါသည်။
              value: transfer_app
              # User အမည်ကို "transfer_app" ဟု သတ်မှတ်ပါသည်။
            - name: MYSQL_PASSWORD
              # User password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret မှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: TRANSFER_DB_PASSWORD
                  # "TRANSFER_DB_PASSWORD" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
          volumeMounts:
          # Storage ချိတ်ဆက်သည့်အပိုင်းဖြစ်ပါသည်။
            - name: mysql-data
              # "mysql-data" volume ကို သုံးပါမည်။
              mountPath: /var/lib/mysql
              # "/var/lib/mysql" တွင် ချိတ်ဆက်သိမ်းဆည်းပါမည်။
          readinessProbe:
          # အသင့်ဖြစ်မဖြစ် စစ်ဆေးသည့်စနစ်ဖြစ်ပါသည်။
            exec:
            # Command run ၍ စစ်ဆေးပါမည်။
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
              # MySQL အသင့်ဖြစ်မဖြစ် ping ရိုက်စစ်ဆေးပါသည်။
            initialDelaySeconds: 15
            # ၁၅ စက္ကန့်ကြာမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 5
            # ၅ စက္ကန့်တစ်ကြိမ် စစ်ဆေးပါမည်။
          livenessProbe:
          # အသက်ရှင်အလုပ်လုပ်နေခြင်း ရှိမရှိ စစ်ဆေးသည့်စနစ်ဖြစ်ပါသည်။
            exec:
            # Command run ၍ စစ်ဆေးပါမည်။
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
              # MySQL အလုပ်လုပ်နေခြင်း ရှိမရှိ ping ရိုက်စစ်ဆေးပါသည်။
            initialDelaySeconds: 30
            # ၃၀ စက္ကန့်ကြာမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 10
            # ၁၀ စက္ကန့်တစ်ကြိမ် စစ်ဆေးပါမည်။
  volumeClaimTemplates:
  # အမြဲတမ်း သိမ်းဆည်းမည့် Storage တောင်းခံသည့်အပိုင်းဖြစ်ပါသည်။
    - metadata:
      # Volume အချက်အလက်ဖြစ်ပါသည်။
        name: mysql-data
        # Volume အမည် "mysql-data" ဖြစ်ပါသည်။
      spec:
      # Storage သတ်မှတ်ချက်ဖြစ်ပါသည်။
        accessModes: ["ReadWriteOnce"]
        # Node တစ်ခုတည်းမှ ဖတ်/ရေး လုပ်နိုင်သော စနစ်ဖြစ်ပါသည်။
        resources:
        # Resource ပမာဏ သတ်မှတ်ချက်ဖြစ်ပါသည်။
          requests:
          # တောင်းခံသည့် ပမာဏဖြစ်ပါသည်။
            storage: 5Gi
            # Storage 5Gi တောင်းခံထားပါသည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# MySQL: Ledger database
# Ledger Service အတွက် MySQL Database အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Network ချိတ်ဆက်မှုအတွက် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: mysql-ledger
  # Service အမည်ကို "mysql-ledger" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # Port စာရင်းဖြစ်ပါသည်။
    - name: mysql
      # Port အမည် "mysql" ဖြစ်ပါသည်။
      port: 3306
      # Service port နံပါတ် 3306 ဖြစ်ပါသည်။
      targetPort: 3306
      # Container port နံပါတ် 3306 ဖြစ်ပါသည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: mysql-ledger
    # "app: mysql-ledger" label ပါသော Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# StatefulSet အတွက် apps/v1 API ကို သုံးပါသည်။
kind: StatefulSet
# Ledger Database အတွက် StatefulSet အမျိုးအစားဖြစ်ပါသည်။
metadata:
# StatefulSet အချက်အလက်များဖြစ်ပါသည်။
  name: mysql-ledger
  # အမည်ကို "mysql-ledger" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace အတွင်း ထားရှိပါမည်။
spec:
# StatefulSet သတ်မှတ်ချက်များဖြစ်ပါသည်။
  serviceName: mysql-ledger
  # သက်ဆိုင်ရာ Service အမည်မှာ "mysql-ledger" ဖြစ်ပါသည်။
  replicas: 1
  # Pod အရေအတွက် ၁ ခု ထားရှိပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: mysql-ledger
      # "app: mysql-ledger" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: mysql-ledger
        # "app: mysql-ledger" label တပ်ဆင်ပါသည်။
    spec:
    # Pod အတွင်းရှိ Container သတ်မှတ်ချက်ဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: mysql
          # Container အမည် "mysql" ဖြစ်ပါသည်။
          image: mysql:8.4
          # MySQL 8.4 image ကို အသုံးပြုပါသည်။
          ports:
          # Port သတ်မှတ်ချက်ဖြစ်ပါသည်။
            - name: mysql
              # Port အမည် "mysql" ဖြစ်ပါသည်။
              containerPort: 3306
              # Port 3306 ဖွင့်ထားပါသည်။
          env:
          # Environment Variable များဖြစ်ပါသည်။
            - name: MYSQL_ROOT_PASSWORD
              # Root password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret မှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: MYSQL_ROOT_PASSWORD
                  # "MYSQL_ROOT_PASSWORD" key ကို ယူသုံးပါမည်။
            - name: MYSQL_DATABASE
              # တည်ဆောက်မည့် Database အမည် variable ဖြစ်ပါသည်။
              value: ledger_db
              # Database အမည်ကို "ledger_db" ဟု သတ်မှတ်ပါသည်။
            - name: MYSQL_USER
              # အသုံးပြုမည့် User အမည် variable ဖြစ်ပါသည်။
              value: ledger_app
              # User အမည်ကို "ledger_app" ဟု သတ်မှတ်ပါသည်။
            - name: MYSQL_PASSWORD
              # User password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret မှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: LEDGER_DB_PASSWORD
                  # "LEDGER_DB_PASSWORD" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
          volumeMounts:
          # Storage ချိတ်ဆက်သည့်အပိုင်းဖြစ်ပါသည်။
            - name: mysql-data
              # "mysql-data" volume ကို သုံးပါမည်။
              mountPath: /var/lib/mysql
              # "/var/lib/mysql" တွင် ချိတ်ဆက်သိမ်းဆည်းပါမည်။
          readinessProbe:
          # အသင့်ဖြစ်မဖြစ် စစ်ဆေးသည့်စနစ်ဖြစ်ပါသည်။
            exec:
            # Command run ၍ စစ်ဆေးပါမည်။
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
              # MySQL အသင့်ဖြစ်မဖြစ် ping ရိုက်စစ်ဆေးပါသည်။
            initialDelaySeconds: 15
            # ၁၅ စက္ကန့်ကြာမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 5
            # ၅ စက္ကန့်တစ်ကြိမ် စစ်ဆေးပါမည်။
          livenessProbe:
          # အသက်ရှင်အလုပ်လုပ်နေခြင်း ရှိမရှိ စစ်ဆေးသည့်စနစ်ဖြစ်ပါသည်။
            exec:
            # Command run ၍ စစ်ဆေးပါမည်။
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
              # MySQL အလုပ်လုပ်နေခြင်း ရှိမရှိ ping ရိုက်စစ်ဆေးပါသည်။
            initialDelaySeconds: 30
            # ၃၀ စက္ကန့်ကြာမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 10
            # ၁၀ စက္ကန့်တစ်ကြိမ် စစ်ဆေးပါမည်။
  volumeClaimTemplates:
  # အမြဲတမ်း သိမ်းဆည်းမည့် Storage တောင်းခံသည့်အပိုင်းဖြစ်ပါသည်။
    - metadata:
      # Volume အချက်အလက်ဖြစ်ပါသည်။
        name: mysql-data
        # Volume အမည် "mysql-data" ဖြစ်ပါသည်။
      spec:
      # Storage သတ်မှတ်ချက်ဖြစ်ပါသည်။
        accessModes: ["ReadWriteOnce"]
        # Node တစ်ခုတည်းမှ ဖတ်/ရေး လုပ်နိုင်သော စနစ်ဖြစ်ပါသည်။
        resources:
        # Resource ပမာဏ သတ်မှတ်ချက်ဖြစ်ပါသည်။
          requests:
          # တောင်းခံသည့် ပမာဏဖြစ်ပါသည်။
            storage: 5Gi
            # Storage 5Gi တောင်းခံထားပါသည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# RabbitMQ message broker
# Service အချင်းချင်း Message ပို့ဆောင်ပေးမည့် RabbitMQ အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# RabbitMQ သို့ ချိတ်ဆက်ရန် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: rabbitmq
  # Service အမည်ကို "rabbitmq" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # ဖွင့်ပေးမည့် port ၂ ခု စာရင်းဖြစ်ပါသည်။
    - name: amqp
      # ပထမ port အမည်ကို "amqp" (Message ပို့သည့် protocol) ဟု ပေးထားပါသည်။
      port: 5672
      # Service ၏ AMQP port နံပါတ် 5672 ဖြစ်ပါသည်။
      targetPort: 5672
      # Container ၏ port 5672 သို့ ချိတ်ဆက်ပေးပါမည်။
    - name: management
      # ဒုတိယ port အမည်ကို "management" (Web UI အတွက်) ဟု ပေးထားပါသည်။
      port: 15672
      # Management Web UI အတွက် port နံပါတ် 15672 ဖြစ်ပါသည်။
      targetPort: 15672
      # Container ၏ port 15672 သို့ ချိတ်ဆက်ပေးပါမည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: rabbitmq
    # "app: rabbitmq" label ပါသော Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# Deployment အတွက် apps/v1 API ဗားရှင်းကို သုံးပါသည်။
kind: Deployment
# RabbitMQ container ကို run ရန် Deployment အမျိုးအစားကို သုံးပါသည်။
metadata:
# Deployment အချက်အလက်များဖြစ်ပါသည်။
  name: rabbitmq
  # Deployment အမည်ကို "rabbitmq" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Deployment သတ်မှတ်ချက်များဖြစ်ပါသည်။
  replicas: 1
  # RabbitMQ Pod ၁ ခု run ပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: rabbitmq
      # "app: rabbitmq" label ပါသော Pod ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: rabbitmq
        # "app: rabbitmq" label တပ်ဆင်ပါသည်။
    spec:
    # Container နှင့် Volume သတ်မှတ်ချက်များဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: rabbitmq
          # Container အမည် "rabbitmq" ဖြစ်ပါသည်။
          image: rabbitmq:4-management
          # Management UI ပါဝင်သော RabbitMQ version 4 image ကို အသုံးပြုပါသည်။
          ports:
          # Container တွင် ဖွင့်မည့် port စာရင်းဖြစ်ပါသည်။
            - name: amqp
              # Messaging port အမည် "amqp" ဖြစ်ပါသည်။
              containerPort: 5672
              # Port 5672 ဖွင့်ထားပါသည်။
            - name: management
              # Web UI port အမည် "management" ဖြစ်ပါသည်။
              containerPort: 15672
              # Port 15672 ဖွင့်ထားပါသည်။
          env:
          # RabbitMQ အတွက် Environment Variable များဖြစ်ပါသည်။
            - name: RABBITMQ_DEFAULT_USER
              # Default username သတ်မှတ်သည့် variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" ထဲမှ ယူပါမည်။
                  key: RABBITMQ_USER
                  # "RABBITMQ_USER" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
            - name: RABBITMQ_DEFAULT_PASS
              # Default password သတ်မှတ်သည့် variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" ထဲမှ ယူပါမည်။
                  key: RABBITMQ_PASSWORD
                  # "RABBITMQ_PASSWORD" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
          readinessProbe:
          # RabbitMQ အသင့်ဖြစ်မဖြစ် စစ်ဆေးသည့်စနစ်ဖြစ်ပါသည်။
            exec:
            # Command run ၍ စစ်ဆေးပါမည်။
              command: ["rabbitmq-diagnostics", "-q", "ping"]
              # rabbitmq-diagnostics ping command ဖြင့် စစ်ဆေးပါသည်။
            initialDelaySeconds: 20
            # Container စတက်ပြီး ၂၀ စက္ကန့်ကြာမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 10
            # ၁၀ စက္ကန့်တစ်ကြိမ် စစ်ဆေးပါမည်။
          volumeMounts:
          # Container အတွင်း Volume ချိတ်ဆက်မှုဖြစ်ပါသည်။
            - name: rabbitmq-data
              # "rabbitmq-data" volume ကို သုံးပါမည်။
              mountPath: /var/lib/rabbitmq
              # "/var/lib/rabbitmq" လမ်းကြောင်းတွင် ချိတ်ဆက်ပါမည်။
      volumes:
      # Pod အတွက် အသုံးပြုမည့် Volume သတ်မှတ်ချက်ဖြစ်ပါသည်။
        - name: rabbitmq-data
          # Volume အမည်ကို "rabbitmq-data" ဟု ပေးထားပါသည်။
          emptyDir: {}
          # Pod ရှိနေသရွေ့သာ တည်ရှိမည့် ယာယီဖိုင်တွဲ (emptyDir) ကို အသုံးပြုထားပါသည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# Seq logging server
# Application မှတ်တမ်း (Logs) များ ကြည့်ရှုသိမ်းဆည်းသည့် Seq Server အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Seq server သို့ ချိတ်ဆက်ရန် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: seq
  # Service အမည်ကို "seq" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # Port စာရင်းဖြစ်ပါသည်။
    - name: http
      # Port အမည်ကို "http" ဟု ပေးထားပါသည်။
      port: 80
      # Service ၏ port နံပါတ် 80 ဖြစ်ပါသည်။
      targetPort: 80
      # Container ၏ port နံပါတ် 80 သို့ ပို့ပေးပါမည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: seq
    # "app: seq" label ပါသော Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# Deployment အတွက် apps/v1 API ကို သုံးပါသည်။
kind: Deployment
# Seq server အတွက် Deployment အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Deployment အချက်အလက်များဖြစ်ပါသည်။
  name: seq
  # အမည်ကို "seq" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Deployment သတ်မှတ်ချက်များဖြစ်ပါသည်။
  replicas: 1
  # Seq Pod ၁ ခု run ပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: seq
      # "app: seq" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: seq
        # "app: seq" label တပ်ဆင်ပါသည်။
    spec:
    # Container နှင့် Volume သတ်မှတ်ချက်များဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: seq
          # Container အမည် "seq" ဖြစ်ပါသည်။
          image: datalust/seq:latest
          # Datalust ၏ နောက်ဆုံးထွက် Seq image ကို အသုံးပြုပါသည်။
          ports:
          # Port စာရင်းဖြစ်ပါသည်။
            - name: http
              # Port အမည် "http" ဖြစ်ပါသည်။
              containerPort: 80
              # Container port 80 ဖွင့်ထားပါသည်။
          env:
          # Environment Variable များဖြစ်ပါသည်။
            - name: ACCEPT_EULA
              # အသုံးပြုသူ သဘောတူညီချက် (EULA) လက်ခံသည့် variable ဖြစ်ပါသည်။
              value: "Y"
              # သဘောတူကြောင်း "Y" (Yes) ဟု သတ်မှတ်ပါသည်။
            - name: SEQ_FIRSTRUN_ADMINPASSWORD
              # ပထမဆုံးအကြိမ် စတင်ချိန်တွင် သတ်မှတ်မည့် Admin password variable ဖြစ်ပါသည်။
              value: "CHANGE_ME_SEQ_PASSWORD"
              # Admin password တန်ဖိုးဖြစ်သည် (အသုံးမပြုမီ ပြောင်းလဲရန်)။
          volumeMounts:
          # Volume ချိတ်ဆက်သည့်အပိုင်းဖြစ်ပါသည်။
            - name: seq-data
              # "seq-data" volume ကို သုံးပါမည်။
              mountPath: /data
              # Container ၏ "/data" လမ်းကြောင်းတွင် ချိတ်ဆက်သိမ်းဆည်းပါမည်။
      volumes:
      # Pod အတွက် Volume သတ်မှတ်ချက်ဖြစ်ပါသည်။
        - name: seq-data
          # Volume အမည် "seq-data" ဖြစ်ပါသည်။
          emptyDir: {}
          # ယာယီဖိုင်တွဲ (emptyDir) အဖြစ် သတ်မှတ်ထားပါသည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# Identity Service
# အသုံးပြုသူ အကောင့်နှင့် Authentication စစ်ဆေးသည့် Identity Service အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Identity Service သို့ ချိတ်ဆက်ရန် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: identity-service
  # Service အမည်ကို "identity-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # Port စာရင်းဖြစ်ပါသည်။
    - name: http
      # Port အမည် "http" ဖြစ်ပါသည်။
      port: 8070
      # Service ၏ port နံပါတ် 8070 ဖြစ်ပါသည်။
      targetPort: 8070
      # Container ၏ port နံပါတ် 8070 သို့ ပို့ပေးပါမည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: identity-service
    # "app: identity-service" label ပါသော Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# Deployment အတွက် apps/v1 API ကို သုံးပါသည်။
kind: Deployment
# Identity Service အတွက် Deployment အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Deployment အချက်အလက်များဖြစ်ပါသည်။
  name: identity-service
  # အမည်ကို "identity-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Deployment သတ်မှတ်ချက်များဖြစ်ပါသည်။
  replicas: 1
  # Identity Service Pod ၁ ခု run ပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: identity-service
      # "app: identity-service" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: identity-service
        # "app: identity-service" label တပ်ဆင်ပါသည်။
    spec:
    # Container သတ်မှတ်ချက်များဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: identity-service
          # Container အမည် "identity-service" ဖြစ်ပါသည်။
          image: registry.example.com/digital-wallet/identity-service:latest
          # ကိုယ်ပိုင် Container Registry မှ identity-service image ကို ဆွဲယူသုံးပါမည် (အမည်အစစ်ဖြင့် အစားထိုးရန်)။
          ports:
          # Port စာရင်းဖြစ်ပါသည်။
            - name: http
              # Port အမည် "http" ဖြစ်ပါသည်။
              containerPort: 8070
              # Container port 8070 ဖွင့်ထားပါသည်။
          envFrom:
          # ConfigMap တစ်ခုလုံးရှိ key-value အားလုံးကို Environment Variable အဖြစ် ဆွဲယူမည့်အပိုင်းဖြစ်ပါသည်။
            - configMapRef:
              # ConfigMap မှ ရယူမည်ဖြစ်ကြောင်း သတ်မှတ်ပါသည်။
                name: wallet-config
                # "wallet-config" အမည်ရှိ ConfigMap မှ setting အားလုံးကို ယူသုံးပါမည်။
          env:
          # သီးသန့်ထပ်မံထည့်သွင်းမည့် Environment Variable များဖြစ်ပါသည်။
            - name: ASPNETCORE_HTTP_PORTS
              # .NET app နားထောင်မည့် HTTP port သတ်မှတ်ချက်ဖြစ်ပါသည်။
              value: "8070"
              # Port 8070 ဟု သတ်မှတ်ပါသည်။
            - name: Jwt__Secret
              # JWT secret key variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: JWT_SECRET
                  # "JWT_SECRET" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
            - name: IDENTITY_DB_PASSWORD
              # အောက်ပါ Connection String တွင် ပြန်ယူသုံးရန် DB password variable ကို ကြိုတင်ကြေညာခြင်းဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: IDENTITY_DB_PASSWORD
                  # "IDENTITY_DB_PASSWORD" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
            - name: ConnectionStrings__IdentityDb
              # .NET Identity Database သို့ ချိတ်ဆက်မည့် Connection String variable ဖြစ်ပါသည်။
              value: "Server=mysql-identity;Port=3306;Database=identity_db;User=identity_app;Password=$(IDENTITY_DB_PASSWORD)"
              # အပေါ်တွင် ကြေညာခဲ့သော $(IDENTITY_DB_PASSWORD) ကို ထည့်သွင်းပြီး mysql-identity သို့ ချိတ်ဆက်ပါသည်။
            - name: RabbitMQ__UserName
              # RabbitMQ username အတွက် variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: RABBITMQ_USER
                  # "RABBITMQ_USER" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
            - name: RabbitMQ__Password
              # RabbitMQ password အတွက် variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: RABBITMQ_PASSWORD
                  # "RABBITMQ_PASSWORD" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# Wallet Service
# ပိုက်ဆံအိတ် လက်ကျန်ငွေနှင့် အကောင့်များ စီမံခန့်ခွဲသည့် Wallet Service အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Wallet Service သို့ ချိတ်ဆက်ရန် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: wallet-service
  # Service အမည်ကို "wallet-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # Port စာရင်းဖြစ်ပါသည်။
    - name: http
      # Port အမည် "http" ဖြစ်ပါသည်။
      port: 8040
      # Service ၏ port နံပါတ် 8040 ဖြစ်ပါသည်။
      targetPort: 8040
      # Container ၏ port နံပါတ် 8040 သို့ ပို့ပေးပါမည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: wallet-service
    # "app: wallet-service" label ပါသော Pod များသို့ load balance လုပ်ပြီး ပို့ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# Deployment အတွက် apps/v1 API ကို သုံးပါသည်။
kind: Deployment
# Wallet Service အတွက် Deployment အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Deployment အချက်အလက်များဖြစ်ပါသည်။
  name: wallet-service
  # အမည်ကို "wallet-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Deployment သတ်မှတ်ချက်များဖြစ်ပါသည်။
  replicas: 2
  # Traffic များနိုင်သဖြင့် Wallet Service Pod ၂ ခု တစ်ပြိုင်နက် run ထားပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: wallet-service
      # "app: wallet-service" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: wallet-service
        # "app: wallet-service" label တပ်ဆင်ပါသည်။
    spec:
    # Container သတ်မှတ်ချက်များဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: wallet-service
          # Container အမည် "wallet-service" ဖြစ်ပါသည်။
          image: registry.example.com/digital-wallet/wallet-service:latest
          # Container Registry မှ wallet-service image ကို ဆွဲယူသုံးပါမည်။
          ports:
          # Port စာရင်းဖြစ်ပါသည်။
            - name: http
              # Port အမည် "http" ဖြစ်ပါသည်။
              containerPort: 8040
              # Container port 8040 ဖွင့်ထားပါသည်။
          envFrom:
          # ConfigMap မှ environment variable များ ဆွဲယူမည့်အပိုင်းဖြစ်ပါသည်။
            - configMapRef:
              # ConfigMap အညွှန်းဖြစ်ပါသည်။
                name: wallet-config
                # "wallet-config" ထဲရှိ တန်ဖိုးများကို ရယူသုံးစွဲပါမည်။
          env:
          # သီးသန့် Environment Variable များဖြစ်ပါသည်။
            - name: ASPNETCORE_HTTP_PORTS
              # .NET HTTP port သတ်မှတ်ချက်ဖြစ်ပါသည်။
              value: "8040"
              # Port 8040 ဟု သတ်မှတ်ပါသည်။
            - name: Jwt__Secret
              # JWT secret variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: JWT_SECRET
                  # "JWT_SECRET" key ကို ယူသုံးပါမည်။
            - name: Internal__ApiKey
              # Service အချင်းချင်း ချိတ်ဆက်ရာတွင် စစ်ဆေးမည့် Internal API Key ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: INTERNAL_SERVICE_KEY
                  # "INTERNAL_SERVICE_KEY" key ကို ယူသုံးပါမည်။
            - name: WALLET_DB_PASSWORD
              # Connection string တွင် ပြန်သုံးရန် Wallet DB password ကို ရယူခြင်းဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: WALLET_DB_PASSWORD
                  # "WALLET_DB_PASSWORD" key ကို ယူသုံးပါမည်။
            - name: ConnectionStrings__WalletDb
              # Wallet Database ချိတ်ဆက်မည့် Connection String ဖြစ်ပါသည်။
              value: "Server=mysql-wallet;Port=3306;Database=wallet_db;User=wallet_app;Password=$(WALLET_DB_PASSWORD)"
              # mysql-wallet server သို့ $(WALLET_DB_PASSWORD) သုံး၍ ချိတ်ဆက်ပါသည်။
            - name: RabbitMQ__UserName
              # RabbitMQ username variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: RABBITMQ_USER
                  # "RABBITMQ_USER" key ကို ယူသုံးပါမည်။
            - name: RabbitMQ__Password
              # RabbitMQ password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: RABBITMQ_PASSWORD
                  # "RABBITMQ_PASSWORD" key ကို ယူသုံးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# Transfer Service
# ငွေလွှဲပြောင်းမှု လုပ်ငန်းစဉ်များကို ဆောင်ရွက်သည့် Transfer Service အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Transfer Service သို့ ချိတ်ဆက်ရန် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: transfer-service
  # Service အမည်ကို "transfer-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # Port စာရင်းဖြစ်ပါသည်။
    - name: http
      # Port အမည် "http" ဖြစ်ပါသည်။
      port: 8050
      # Service ၏ port နံပါတ် 8050 ဖြစ်ပါသည်။
      targetPort: 8050
      # Container ၏ port နံပါတ် 8050 သို့ ပို့ပေးပါမည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: transfer-service
    # "app: transfer-service" label ပါသော Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# Deployment အတွက် apps/v1 API ကို သုံးပါသည်။
kind: Deployment
# Transfer Service အတွက် Deployment အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Deployment အချက်အလက်များဖြစ်ပါသည်။
  name: transfer-service
  # အမည်ကို "transfer-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Deployment သတ်မှတ်ချက်များဖြစ်ပါသည်။
  replicas: 1
  # Transfer Service Pod ၁ ခု run ပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: transfer-service
      # "app: transfer-service" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: transfer-service
        # "app: transfer-service" label တပ်ဆင်ပါသည်။
    spec:
    # Container သတ်မှတ်ချက်များဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: transfer-service
          # Container အမည် "transfer-service" ဖြစ်ပါသည်။
          image: registry.example.com/digital-wallet/transfer-service:latest
          # Container Registry မှ transfer-service image ကို ဆွဲယူသုံးပါမည်။
          ports:
          # Port စာရင်းဖြစ်ပါသည်။
            - name: http
              # Port အမည် "http" ဖြစ်ပါသည်။
              containerPort: 8050
              # Container port 8050 ဖွင့်ထားပါသည်။
          envFrom:
          # ConfigMap မှ environment variable များ ဆွဲယူမည့်အပိုင်းဖြစ်ပါသည်။
            - configMapRef:
              # ConfigMap အညွှန်းဖြစ်ပါသည်။
                name: wallet-config
                # "wallet-config" ထဲရှိ တန်ဖိုးများကို ရယူသုံးစွဲပါမည်။
          env:
          # သီးသန့် Environment Variable များဖြစ်ပါသည်။
            - name: ASPNETCORE_HTTP_PORTS
              # .NET HTTP port သတ်မှတ်ချက်ဖြစ်ပါသည်။
              value: "8050"
              # Port 8050 ဟု သတ်မှတ်ပါသည်။
            - name: Jwt__Secret
              # JWT secret variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: JWT_SECRET
                  # "JWT_SECRET" key ကို ယူသုံးပါမည်။
            - name: Internal__ApiKey
              # Internal API key variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: INTERNAL_SERVICE_KEY
                  # "INTERNAL_SERVICE_KEY" key ကို ယူသုံးပါမည်။
            - name: TRANSFER_DB_PASSWORD
              # Connection string တွင် သုံးရန် Transfer DB password ကို ရယူခြင်းဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: TRANSFER_DB_PASSWORD
                  # "TRANSFER_DB_PASSWORD" key ကို ယူသုံးပါမည်။
            - name: ConnectionStrings__TransferDb
              # Transfer Database သို့ ချိတ်ဆက်မည့် Connection String ဖြစ်ပါသည်။
              value: "Server=mysql-transfer;Port=3306;Database=transfer_db;User=transfer_app;Password=$(TRANSFER_DB_PASSWORD)"
              # mysql-transfer server သို့ $(TRANSFER_DB_PASSWORD) သုံး၍ ချိတ်ဆက်ပါသည်။
            - name: WalletService__BaseUrl
              # Transfer လုပ်ရာတွင် လှမ်းခေါ်မည့် Wallet Service ၏ URL ဖြစ်ပါသည်။
              value: "http://wallet-service:8040/"
              # "http://wallet-service:8040/" သို့ ချိတ်ဆက်ပါမည်။
            - name: RabbitMQ__UserName
              # RabbitMQ username variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: RABBITMQ_USER
                  # "RABBITMQ_USER" key ကို ယူသုံးပါမည်။
            - name: RabbitMQ__Password
              # RabbitMQ password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: RABBITMQ_PASSWORD
                  # "RABBITMQ_PASSWORD" key ကို ယူသုံးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# Ledger Service & Ledger Consumer
# ငွေစာရင်းမှတ်တမ်း (Ledger) API နှင့် RabbitMQ မှ စာရင်းသွင်းသည့် Consumer အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Ledger Service သို့ ချိတ်ဆက်ရန် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: ledger-service
  # Service အမည်ကို "ledger-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # Port စာရင်းဖြစ်ပါသည်။
    - name: http
      # Port အမည် "http" ဖြစ်ပါသည်။
      port: 8060
      # Service ၏ port နံပါတ် 8060 ဖြစ်ပါသည်။
      targetPort: 8060
      # Container ၏ port နံပါတ် 8060 သို့ ပို့ပေးပါမည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: ledger-service
    # "app: ledger-service" label ပါသော Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# Deployment အတွက် apps/v1 API ကို သုံးပါသည်။
kind: Deployment
# Ledger API Service အတွက် Deployment အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Deployment အချက်အလက်များဖြစ်ပါသည်။
  name: ledger-service
  # အမည်ကို "ledger-service" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Deployment သတ်မှတ်ချက်များဖြစ်ပါသည်။
  replicas: 1
  # Ledger Service Pod ၁ ခု run ပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: ledger-service
      # "app: ledger-service" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: ledger-service
        # "app: ledger-service" label တပ်ဆင်ပါသည်။
    spec:
    # Container သတ်မှတ်ချက်များဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: ledger-service
          # Container အမည် "ledger-service" ဖြစ်ပါသည်။
          image: registry.example.com/digital-wallet/ledger-service:latest
          # Container Registry မှ ledger-service image ကို ဆွဲယူသုံးပါမည်။
          ports:
          # Port စာရင်းဖြစ်ပါသည်။
            - name: http
              # Port အမည် "http" ဖြစ်ပါသည်။
              containerPort: 8060
              # Container port 8060 ဖွင့်ထားပါသည်။
          env:
          # Ledger Service (Node.js) အတွက် Environment Variable များဖြစ်ပါသည်။
            - name: DB_HOST
              # Database host အမည် variable ဖြစ်ပါသည်။
              value: "mysql-ledger"
              # "mysql-ledger" service သို့ ချိတ်ဆက်ပါမည်။
            - name: DB_PORT
              # Database port variable ဖြစ်ပါသည်။
              value: "3306"
              # Port 3306 ကို သုံးပါမည်။
            - name: DB_DATABASE
              # Database အမည် variable ဖြစ်ပါသည်။
              value: "ledger_db"
              # "ledger_db" database ကို သုံးပါမည်။
            - name: DB_USERNAME
              # Database username variable ဖြစ်ပါသည်။
              value: "ledger_app"
              # "ledger_app" user ကို သုံးပါမည်။
            - name: DB_PASSWORD
              # Database password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: LEDGER_DB_PASSWORD
                  # "LEDGER_DB_PASSWORD" key ကို ယူသုံးပါမည်။
            - name: JWT_ISSUER
              # JWT ထုတ်ပေးသည့် Issuer အမည်ဖြစ်ပါသည်။
              value: "DigitalWallet.Identity"
              # "DigitalWallet.Identity" ဟု သတ်မှတ်ပါသည်။
            - name: JWT_AUDIENCE
              # JWT Audience အမည်ဖြစ်ပါသည်။
              value: "DigitalWallet.Services"
              # "DigitalWallet.Services" ဟု သတ်မှတ်ပါသည်။
            - name: JWT_SECRET
              # JWT Secret key variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: JWT_SECRET
                  # "JWT_SECRET" key ကို ယူသုံးပါမည်။
            - name: INTERNAL_SERVICE_KEY
              # Internal Service Key variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: INTERNAL_SERVICE_KEY
                  # "INTERNAL_SERVICE_KEY" key ကို ယူသုံးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# (docker-compose.yml တွင်ပါဝင်သော ledger-consumer background worker ကိုပါ ပြည့်စုံစေရန် ထည့်သွင်းထားပါသည်)
apiVersion: apps/v1
# Deployment အတွက် apps/v1 API ကို သုံးပါသည်။
kind: Deployment
# RabbitMQ မှ message ဖတ်ယူမည့် Ledger Consumer အတွက် Deployment ဖြစ်ပါသည်။
metadata:
# Deployment အချက်အလက်များဖြစ်ပါသည်။
  name: ledger-consumer
  # အမည်ကို "ledger-consumer" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Deployment သတ်မှတ်ချက်များဖြစ်ပါသည်။
  replicas: 1
  # Ledger Consumer Pod ၁ ခု run ပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: ledger-consumer
      # "app: ledger-consumer" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: ledger-consumer
        # "app: ledger-consumer" label တပ်ဆင်ပါသည်။
    spec:
    # Container သတ်မှတ်ချက်များဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: ledger-consumer
          # Container အမည် "ledger-consumer" ဖြစ်ပါသည်။
          image: registry.example.com/digital-wallet/ledger-service:latest
          # ledger-service image ကိုပင် အသုံးပြုပြီး consumer command ဖြင့် run ပါမည်။
          command: ["node", "dist/consumer.js"]
          # Container စတင်ချိန်တွင် "node dist/consumer.js" command ကို run စေပါသည်။
          env:
          # Ledger Consumer အတွက် Environment Variable များဖြစ်ပါသည်။
            - name: DB_HOST
              # Database host အမည်ဖြစ်ပါသည်။
              value: "mysql-ledger"
              # "mysql-ledger" သို့ ချိတ်ဆက်ပါမည်။
            - name: DB_PORT
              # Database port နံပါတ်ဖြစ်ပါသည်။
              value: "3306"
              # Port 3306 ကို သုံးပါမည်။
            - name: DB_DATABASE
              # Database အမည်ဖြစ်ပါသည်။
              value: "ledger_db"
              # "ledger_db" ကို သုံးပါမည်။
            - name: DB_USERNAME
              # Database user အမည်ဖြစ်ပါသည်။
              value: "ledger_app"
              # "ledger_app" ကို သုံးပါမည်။
            - name: DB_PASSWORD
              # Database password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: LEDGER_DB_PASSWORD
                  # "LEDGER_DB_PASSWORD" key ကို ယူသုံးပါမည်။
            - name: RABBITMQ_HOST
              # RabbitMQ host အမည်ဖြစ်ပါသည်။
              value: "rabbitmq"
              # "rabbitmq" service သို့ ချိတ်ဆက်ပါမည်။
            - name: RABBITMQ_PORT
              # RabbitMQ port နံပါတ်ဖြစ်ပါသည်။
              value: "5672"
              # Port 5672 ကို သုံးပါမည်။
            - name: RABBITMQ_USER
              # RabbitMQ username variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: RABBITMQ_USER
                  # "RABBITMQ_USER" key ကို ယူသုံးပါမည်။
            - name: RABBITMQ_PASSWORD
              # RabbitMQ password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" မှ ရယူပါမည်။
                  key: RABBITMQ_PASSWORD
                  # "RABBITMQ_PASSWORD" key ကို ယူသုံးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# Realtime Service
