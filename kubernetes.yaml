                  # "RABBITMQ_PASSWORD" key ကို ယူသုံးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# API Gateway
# ပြင်ပမှ ဝင်လာသော Request အားလုံးကို သက်ဆိုင်ရာ Service များသို့ လမ်းကြောင်းခွဲပေးသည့် API Gateway အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# API Gateway ကို ပြင်ပမှ ခေါ်ယူနိုင်ရန် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service အချက်အလက်များဖြစ်ပါသည်။
  name: api-gateway
  # Service အမည်ကို "api-gateway" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service သတ်မှတ်ချက်များဖြစ်ပါသည်။
  type: NodePort
  # Cluster ပြင်ပမှ တိုက်ရိုက်လှမ်းခေါ်နိုင်ရန် NodePort အမျိုးအစားအဖြစ် သတ်မှတ်ပါသည်။
  ports:
  # Port စာရင်းဖြစ်ပါသည်။
    - name: http
      # Port အမည် "http" ဖြစ်ပါသည်။
      port: 8080
      # Cluster အတွင်း သုံးမည့် Service port နံပါတ် 8080 ဖြစ်ပါသည်။
      targetPort: 8080
      # Container ၏ port နံပါတ် 8080 သို့ ပို့ပေးပါမည်။
      nodePort: 30080
      # ပြင်ပမှ Node IP နှင့် တွဲခေါ်ရမည့် Port နံပါတ်ကို 30080 ဟု သတ်မှတ်ပါသည်။
  selector:
  # Pod ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: api-gateway
    # "app: api-gateway" label ပါသော Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# Deployment အတွက် apps/v1 API ကို သုံးပါသည်။
kind: Deployment
# API Gateway အတွက် Deployment အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Deployment အချက်အလက်များဖြစ်ပါသည်။
  name: api-gateway
  # အမည်ကို "api-gateway" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Deployment သတ်မှတ်ချက်များဖြစ်ပါသည်။
  replicas: 1
  # API Gateway Pod ၁ ခု run ပါမည်။
  selector:
  # ထိန်းချုပ်မည့် Pod ရွေးချယ်မှုဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: api-gateway
      # "app: api-gateway" label ဖြစ်ပါသည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်မည့် label ဖြစ်ပါသည်။
        app: api-gateway
        # "app: api-gateway" label တပ်ဆင်ပါသည်။
    spec:
    # Pod အတွင်းရှိ Container များ သတ်မှတ်ချက်ဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: api-gateway
          # ပထမ Container အမည် "api-gateway" ဖြစ်ပါသည်။
          image: registry.example.com/digital-wallet/api-gateway:latest
          # Container Registry မှ api-gateway image ကို ဆွဲယူသုံးပါမည်။
          ports:
          # Port စာရင်းဖြစ်ပါသည်။
            - name: http
              # Port အမည် "http" ဖြစ်ပါသည်။
              containerPort: 8080
              # Container port 8080 ဖွင့်ထားပါသည်။
          env:
          # Environment Variable များဖြစ်ပါသည်။
            - name: ASPNETCORE_ENVIRONMENT
              # .NET Environment သတ်မှတ်ချက်ဖြစ်ပါသည်။
              value: "Development"
              # "Development" environment ဟု သတ်မှတ်ပါသည်။
            - name: ASPNETCORE_HTTP_PORTS
              # .NET HTTP port သတ်မှတ်ချက်ဖြစ်ပါသည်။
              value: "8080"
              # Port 8080 ဟု သတ်မှတ်ပါသည်။
        - name: gateway-localhost-forwarder
          # ဒုတိယ Sidecar Container အမည်ဖြစ်သည် (Gateway ၏ localhost port များကို သက်ဆိုင်ရာ Kubernetes Service များသို့ ပို့ပေးရန်)။
          image: alpine:3.20
          # ပေါ့ပါးသော Alpine Linux 3.20 image ကို အသုံးပြုပါသည်။
          command:
          # Container စတင်ချိန်တွင် run မည့် command ဖြစ်ပါသည်။
            - /bin/sh
            # Shell script ကို အသုံးပြုပါမည်။
            - -c
            # အောက်ပါ command စာကြောင်းကို run ပါမည်။
            - >-
              apk add --no-cache socat && (
              socat TCP4-LISTEN:8070,fork,reuseaddr TCP4:identity-service:8070 &
              socat TCP4-LISTEN:8040,fork,reuseaddr TCP4:wallet-service:8040 &
              socat TCP4-LISTEN:8050,fork,reuseaddr TCP4:transfer-service:8050 &
              socat TCP4-LISTEN:8060,fork,reuseaddr TCP4:ledger-service:8060 &
              socat TCP4-LISTEN:8090,fork,reuseaddr TCP4:realtime-service:8090 &
              wait)
            # socat tool ကို သွင်းပြီး Pod အတွင်းရှိ localhost port (8070, 8040, 8050, 8060, 8090) များမှ သက်ဆိုင်ရာ Kubernetes service များသို့ တိုက်ရိုက်လမ်းကြောင်းလွှဲပေးပါသည်။
