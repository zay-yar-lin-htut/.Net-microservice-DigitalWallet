# ============================================================
# Digital Wallet - Kubernetes Starter Manifests (မြန်မာဘာသာဖြင့် တစ်ကြောင်းချင်း ရှင်းလင်းချက်)
# ============================================================

apiVersion: v1
# Kubernetes API ဗားရှင်း v1 ကို အသုံးပြုမည်ဟု သတ်မှတ်ခြင်းဖြစ်ပါသည်။
kind: Namespace
# ဖန်တီးမည့် Kubernetes အရာဝတ္ထု (Resource) အမျိုးအစားမှာ Namespace ဖြစ်ပါသည်။
metadata:
# ၎င်း Resource ၏ အချက်အလက် (Metadata) များကို သတ်မှတ်မည့်အပိုင်းဖြစ်ပါသည်။
  name: digital-wallet
  # Namespace ၏ အမည်ကို "digital-wallet" ဟု သတ်မှတ်ခြင်းဖြစ်ပါသည်။
---
# YAML ဖိုင်တစ်ခုတည်းတွင် Resource တစ်ခုနှင့်တစ်ခု ခွဲခြားသတ်မှတ်သည့် သင်္ကေတဖြစ်ပါသည်။
# Shared non-secret settings used by the .NET services.
# .NET service များအားလုံး မျှဝေသုံးစွဲမည့် လျှို့ဝှက်ရန်မလိုသော (non-secret) setting များဖြစ်ပါသည်။
apiVersion: v1
# ConfigMap အတွက် Kubernetes API ဗားရှင်း v1 ကို အသုံးပြုပါသည်။
kind: ConfigMap
# Configuration ဒေတာများ သိမ်းဆည်းရန် ConfigMap အမျိုးအစားကို သုံးပါသည်။
metadata:
# ConfigMap ၏ အမည်နှင့် Namespace အချက်အလက်များ သတ်မှတ်မည့်အပိုင်းဖြစ်ပါသည်။
  name: wallet-config
  # ConfigMap ၏ အမည်ကို "wallet-config" ဟု ပေးထားပါသည်။
  namespace: digital-wallet
  # ဤ ConfigMap ကို "digital-wallet" namespace အတွင်း၌ ထားရှိပါမည်။
data:
# သိမ်းဆည်းမည့် key-value configuration အချက်အလက်များ စတင်သည့်အပိုင်းဖြစ်ပါသည်။
  ASPNETCORE_ENVIRONMENT: "Development"
  # .NET application ၏ run မည့် environment ကို Development ဟု သတ်မှတ်ထားပါသည်။
  Jwt__Issuer: "DigitalWallet.Identity"
  # JWT token ထုတ်ပေးသည့် Issuer အမည်ကို "DigitalWallet.Identity" ဟု သတ်မှတ်ပါသည်။
  Jwt__Audience: "DigitalWallet.Services"
  # JWT token လက်ခံသုံးစွဲမည့် Audience ကို "DigitalWallet.Services" ဟု သတ်မှတ်ပါသည်။
  RABBITMQ_HOST: "rabbitmq"
  # Node.js/Realtime service များအတွက် RabbitMQ server ၏ host အမည်ကို "rabbitmq" ဟု သတ်မှတ်ပါသည်။
  RABBITMQ_PORT: "5672"
  # RabbitMQ ချိတ်ဆက်မည့် port နံပါတ်ကို 5672 ဟု သတ်မှတ်ပါသည်။
  RabbitMQ__HostName: "rabbitmq"
  # .NET service များအတွက် RabbitMQ host အမည်ကို "rabbitmq" ဟု သတ်မှတ်ပါသည်။
  RabbitMQ__Port: "5672"
  # .NET service များအတွက် RabbitMQ port နံပါတ်ကို 5672 ဟု သတ်မှတ်ပါသည်။
  WalletService__BaseUrl: "http://wallet-service:8040/"
  # Wallet Service သို့ လှမ်းခေါ်မည့် အခြေခံ URL လိပ်စာကို သတ်မှတ်ထားပါသည်။
  DB_PORT: "3306"
  # Database ချိတ်ဆက်မည့် default MySQL port နံပါတ်ကို 3306 ဟု သတ်မှတ်ပါသည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# Demo secrets. In real projects, do not commit real passwords to Git.
# စမ်းသပ်ရန် လျှို့ဝှက်ချက်များ (Secrets) ဖြစ်ပြီး အပြင် လုပ်ငန်းခွင်တွင် password အစစ်များကို Git ပေါ် မတင်ရပါ။
apiVersion: v1
# Secret အတွက် Kubernetes API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Secret
# Password နှင့် API key များ လုံခြုံစွာသိမ်းရန် Secret အမျိုးအစားကို သုံးပါသည်။
metadata:
# Secret ၏ အချက်အလက်များ သတ်မှတ်မည့်အပိုင်းဖြစ်ပါသည်။
  name: wallet-secrets
  # Secret ၏ အမည်ကို "wallet-secrets" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace အတွင်းတွင် ထားရှိပါမည်။
type: Opaque
# သာမန် key-value လျှို့ဝှက်အချက်အလက်များ သိမ်းဆည်းသည့် Opaque အမျိုးအစားဖြစ်ပါသည်။
stringData:
# Base64 ပြောင်းရန်မလိုဘဲ ရိုးရိုးစာသား (Plain text) ဖြင့် Secret များ ရေးသားနိုင်သည့်အပိုင်းဖြစ်ပါသည်။
  JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
  # JWT token လက်မှတ်ထိုးရန် လျှို့ဝှက် key ဖြစ်သည် (အသုံးမပြုမီ ပြောင်းလဲရန် လိုအပ်သည်)။
  INTERNAL_SERVICE_KEY: "CHANGE_ME_INTERNAL_SERVICE_KEY"
  # အတွင်းပိုင်း microservice အချင်းချင်း ဆက်သွယ်ရာတွင် သုံးမည့် API key ဖြစ်ပါသည်။
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_ROOT_PASSWORD"
  # MySQL database အားလုံး၏ root user အတွက် လျှို့ဝှက်နံပါတ်ဖြစ်ပါသည်။
  IDENTITY_DB_PASSWORD: "CHANGE_ME_IDENTITY_PASSWORD"
  # Identity database ၏ user အတွက် လျှို့ဝှက်နံပါတ်ဖြစ်ပါသည်။
  WALLET_DB_PASSWORD: "CHANGE_ME_WALLET_PASSWORD"
  # Wallet database ၏ user အတွက် လျှို့ဝှက်နံပါတ်ဖြစ်ပါသည်။
  TRANSFER_DB_PASSWORD: "CHANGE_ME_TRANSFER_PASSWORD"
  # Transfer database ၏ user အတွက် လျှို့ဝှက်နံပါတ်ဖြစ်ပါသည်။
  LEDGER_DB_PASSWORD: "CHANGE_ME_LEDGER_PASSWORD"
  # Ledger database ၏ user အတွက် လျှို့ဝှက်နံပါတ်ဖြစ်ပါသည်။
  RABBITMQ_USER: "walletapp"
  # RabbitMQ သို့ ဝင်ရောက်မည့် username ကို "walletapp" ဟု သတ်မှတ်ပါသည်။
  RABBITMQ_PASSWORD: "CHANGE_ME_RABBITMQ_PASSWORD"
  # RabbitMQ သို့ ဝင်ရောက်မည့် password ဖြစ်ပါသည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# MySQL: Identity database
# Identity Service အတွက် MySQL Database အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် Kubernetes API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Pod များသို့ network ချိတ်ဆက်ပေးမည့် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service ၏ အချက်အလက်များ သတ်မှတ်မည့်အပိုင်းဖြစ်ပါသည်။
  name: mysql-identity
  # Service အမည်ကို "mysql-identity" (DNS အမည်အဖြစ် သုံးနိုင်သည်) ဟု ပေးထားပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# Service ၏ အသေးစိတ် လုပ်ဆောင်ချက်များကို သတ်မှတ်မည့်အပိုင်းဖြစ်ပါသည်။
  ports:
  # ဖွင့်ပေးမည့် Network Port စာရင်းဖြစ်ပါသည်။
    - name: mysql
      # Port အမည်ကို "mysql" ဟု သတ်မှတ်ပါသည်။
      port: 3306
      # အခြား service များက လှမ်းချိတ်ဆက်ရမည့် Service ၏ port နံပါတ် 3306 ဖြစ်ပါသည်။
      targetPort: 3306
      # Container အတွင်းရှိ အမှန်တကယ် အလုပ်လုပ်နေသော MySQL port နံပါတ် 3306 ဖြစ်ပါသည်။
  selector:
  # မည်သည့် Pod များသို့ traffic ပို့မည်ကို ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: mysql-identity
    # "app: mysql-identity" ဟူသော label ပါသည့် Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# StatefulSet အတွက် apps/v1 API ဗားရှင်းကို အသုံးပြုပါသည်။
kind: StatefulSet
# Database ကဲ့သို့ ဒေတာအမြဲတမ်း သိမ်းဆည်းရန်လိုအပ်သော app များအတွက် StatefulSet ကို သုံးပါသည်။
metadata:
# StatefulSet ၏ အချက်အလက်များ သတ်မှတ်မည့်အပိုင်းဖြစ်ပါသည်။
  name: mysql-identity
  # StatefulSet ၏ အမည်ကို "mysql-identity" ဟု သတ်မှတ်ပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# StatefulSet ၏ အသေးစိတ် သတ်မှတ်ချက်များ စတင်သည့်အပိုင်းဖြစ်ပါသည်။
  serviceName: mysql-identity
  # ဤ StatefulSet ကို ထိန်းချုပ်ချိတ်ဆက်ပေးမည့် Service အမည်မှာ "mysql-identity" ဖြစ်ပါသည်။
  replicas: 1
  # Run မည့် MySQL database Pod အရေအတွက်ကို ၁ ခုဟု သတ်မှတ်ပါသည်။
  selector:
  # StatefulSet က ထိန်းချုပ်မည့် Pod ကို ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    matchLabels:
    # အောက်ပါ label နှင့် ကိုက်ညီသော Pod များကို ရှာဖွေထိန်းချုပ်ပါမည်။
      app: mysql-identity
      # Pod တွင် "app: mysql-identity" label ပါရှိရပါမည်။
  template:
  # တည်ဆောက်မည့် Pod ၏ ပုံစံငယ် (Template) ဖြစ်ပါသည်။
    metadata:
    # Pod ၏ metadata အချက်အလက်များ သတ်မှတ်သည့်အပိုင်းဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်ဆင်မည့် label များဖြစ်ပါသည်။
        app: mysql-identity
        # Service နှင့် Selector က ရှာတွေ့နိုင်ရန် "app: mysql-identity" label တပ်ထားပါသည်။
    spec:
    # Pod အတွင်းရှိ Container များ၏ သတ်မှတ်ချက်ဖြစ်ပါသည်။
      containers:
      # Pod အတွင်း run မည့် container စာရင်းဖြစ်ပါသည်။
        - name: mysql
          # Container အမည်ကို "mysql" ဟု ပေးထားပါသည်။
          image: mysql:8.4
          # Docker Hub မှ MySQL version 8.4 image ကို ဆွဲယူအသုံးပြုပါမည်။
          ports:
          # Container မှ ဖွင့်လှစ်မည့် port စာရင်းဖြစ်ပါသည်။
            - name: mysql
              # Port အမည်ကို "mysql" ဟု သတ်မှတ်ပါသည်။
              containerPort: 3306
              # Container အတွင်းမှ port 3306 ကို ဖွင့်ထားပါမည်။
          env:
          # Container အတွင်း ထည့်သွင်းမည့် Environment Variable များဖြစ်ပါသည်။
            - name: MYSQL_ROOT_PASSWORD
              # MySQL root password အတွက် environment variable အမည်ဖြစ်ပါသည်။
              valueFrom:
              # တန်ဖိုးကို တိုက်ရိုက်မရေးဘဲ ပြင်ပမှ ရယူမည်ဖြစ်ကြောင်း သတ်မှတ်ပါသည်။
                secretKeyRef:
                # Kubernetes Secret ထဲမှ ယူသုံးမည်ဖြစ်ကြောင်း သတ်မှတ်ပါသည်။
                  name: wallet-secrets
                  # "wallet-secrets" အမည်ရှိ Secret ထဲမှ ရယူပါမည်။
                  key: MYSQL_ROOT_PASSWORD
                  # Secret ထဲရှိ "MYSQL_ROOT_PASSWORD" key ၏ တန်ဖိုးကို ယူပါမည်။
            - name: MYSQL_DATABASE
              # Container စတင်ချိန်တွင် အလိုအလျောက် တည်ဆောက်မည့် Database အမည် variable ဖြစ်ပါသည်။
              value: identity_db
              # Database အမည်ကို "identity_db" ဟု သတ်မှတ်ပါသည်။
            - name: MYSQL_USER
              # အသစ်ဖန်တီးမည့် MySQL user အမည် variable ဖြစ်ပါသည်။
              value: identity_app
              # User အမည်ကို "identity_app" ဟု သတ်မှတ်ပါသည်။
            - name: MYSQL_PASSWORD
              # ၎င်း user အတွက် password သတ်မှတ်မည့် variable ဖြစ်ပါသည်။
              valueFrom:
              # တန်ဖိုးကို ပြင်ပမှ ရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" ထဲမှ ယူပါမည်။
                  key: IDENTITY_DB_PASSWORD
                  # "IDENTITY_DB_PASSWORD" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
          volumeMounts:
          # Storage disk ကို container အတွင်းသို့ ချိတ်ဆက်မည့်အပိုင်းဖြစ်ပါသည်။
            - name: mysql-data
              # အသုံးပြုမည့် volume အမည်မှာ "mysql-data" ဖြစ်ပါသည်။
              mountPath: /var/lib/mysql
              # MySQL ဒေတာသိမ်းသည့် "/var/lib/mysql" လမ်းကြောင်းသို့ ချိတ်ဆက်သိမ်းဆည်းပါမည်။
          readinessProbe:
          # Container သည် traffic လက်ခံရန် အဆင်သင့်ဖြစ်မဖြစ် စစ်ဆေးသည့်စနစ်ဖြစ်ပါသည်။
            exec:
            # Command တစ်ခု run ပြီး စစ်ဆေးမည်ဖြစ်ပါသည်။
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
              # mysqladmin ping command ဖြင့် MySQL server အသင့်ဖြစ်မဖြစ် စစ်ဆေးပါသည်။
            initialDelaySeconds: 15
            # Container စတက်ပြီး ၁၅ စက္ကန့်ကြာမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 5
            # ၅ စက္ကန့်လျှင် တစ်ကြိမ် ပုံမှန်စစ်ဆေးပါမည်။
          livenessProbe:
          # Container ဆက်လက်အသက်ရှင် အလုပ်လုပ်နေခြင်း ရှိမရှိ စစ်ဆေးသည့်စနစ် (ပျက်ပါက restart ချပေးမည်)။
            exec:
            # Command တစ်ခု run ပြီး စစ်ဆေးပါမည်။
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
              # mysqladmin ping command ဖြင့် MySQL တုံ့ပြန်မှု ရှိမရှိ စစ်ဆေးပါသည်။
            initialDelaySeconds: 30
            # Container စတက်ပြီး ၃၀ စက္ကန့်ကြာမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 10
            # ၁၀ စက္ကန့်လျှင် တစ်ကြိမ် ပုံမှန်စစ်ဆေးပါမည်။
  volumeClaimTemplates:
  # Pod ပျက်သွားသော်လည်း ဒေတာမပျောက်စေရန် PersistentVolumeClaim (PVC) အလိုအလျောက် တောင်းခံသည့်အပိုင်းဖြစ်ပါသည်။
    - metadata:
      # Volume Claim ၏ အချက်အလက်ဖြစ်ပါသည်။
        name: mysql-data
        # Volume Claim အမည်ကို "mysql-data" ဟု သတ်မှတ်ပါသည်။
      spec:
      # Storage သတ်မှတ်ချက်များဖြစ်ပါသည်။
        accessModes: ["ReadWriteOnce"]
        # Node တစ်ခုတည်းမှသာ တစ်ပြိုင်နက် ဖတ်/ရေး ပြုလုပ်နိုင်သော စနစ် (ReadWriteOnce) ဖြစ်ပါသည်။
        resources:
        # လိုအပ်သော storage ပမာဏ သတ်မှတ်ချက်ဖြစ်ပါသည်။
          requests:
          # တောင်းခံမည့် ပမာဏဖြစ်ပါသည်။
            storage: 5Gi
            # Storage ပမာဏ 5 Gigabytes (5Gi) တောင်းခံထားပါသည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
# -------------------------
# MySQL: Wallet database
# Wallet Service အတွက် MySQL Database အပိုင်း
# -------------------------
apiVersion: v1
# Service အတွက် Kubernetes API ဗားရှင်း v1 ကို သုံးပါသည်။
kind: Service
# Network ချိတ်ဆက်ပေးမည့် Service အမျိုးအစားဖြစ်ပါသည်။
metadata:
# Service ၏ အချက်အလက်များဖြစ်ပါသည်။
  name: mysql-wallet
  # Service အမည်ကို "mysql-wallet" ဟု ပေးထားပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace အတွင်း ထားရှိပါမည်။
spec:
# Service ၏ သတ်မှတ်ချက်များဖြစ်ပါသည်။
  ports:
  # ဖွင့်ပေးမည့် port စာရင်းဖြစ်ပါသည်။
    - name: mysql
      # Port အမည်ကို "mysql" ဟု ပေးထားပါသည်။
      port: 3306
      # Service ၏ port နံပါတ် 3306 ဖြစ်ပါသည်။
      targetPort: 3306
      # Container ၏ port နံပါတ် 3306 သို့ ပို့ပေးပါမည်။
  selector:
  # ချိတ်ဆက်မည့် Pod ကို ရွေးချယ်သည့်အပိုင်းဖြစ်ပါသည်။
    app: mysql-wallet
    # "app: mysql-wallet" label ပါသော Pod သို့ ချိတ်ဆက်ပေးပါမည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
apiVersion: apps/v1
# StatefulSet အတွက် apps/v1 API ဗားရှင်းကို အသုံးပြုပါသည်။
kind: StatefulSet
# Wallet Database အတွက် StatefulSet အမျိုးအစားကို အသုံးပြုပါသည်။
metadata:
# StatefulSet ၏ အချက်အလက်များဖြစ်ပါသည်။
  name: mysql-wallet
  # StatefulSet အမည်ကို "mysql-wallet" ဟု ပေးထားပါသည်။
  namespace: digital-wallet
  # "digital-wallet" namespace ထဲတွင် ထားရှိပါမည်။
spec:
# StatefulSet ၏ အသေးစိတ် သတ်မှတ်ချက်များဖြစ်ပါသည်။
  serviceName: mysql-wallet
  # ချိတ်ဆက်ထားသော Service အမည်မှာ "mysql-wallet" ဖြစ်ပါသည်။
  replicas: 1
  # Database Pod ၁ ခုတည်းသာ run ပါမည်။
  selector:
  # Pod ရွေးချယ်သည့် သတ်မှတ်ချက်ဖြစ်ပါသည်။
    matchLabels:
    # ကိုက်ညီရမည့် label ဖြစ်ပါသည်။
      app: mysql-wallet
      # "app: mysql-wallet" label ပါသော Pod ကို ထိန်းချုပ်ပါမည်။
  template:
  # Pod တည်ဆောက်မည့် ပုံစံငယ်ဖြစ်ပါသည်။
    metadata:
    # Pod ၏ metadata ဖြစ်ပါသည်။
      labels:
      # Pod တွင် တပ်ဆင်မည့် label ဖြစ်ပါသည်။
        app: mysql-wallet
        # "app: mysql-wallet" ဟု label တပ်ဆင်ပါသည်။
    spec:
    # Pod အတွင်းရှိ Container သတ်မှတ်ချက်ဖြစ်ပါသည်။
      containers:
      # Container စာရင်းဖြစ်ပါသည်။
        - name: mysql
          # Container အမည်မှာ "mysql" ဖြစ်ပါသည်။
          image: mysql:8.4
          # MySQL 8.4 image ကို အသုံးပြုပါသည်။
          ports:
          # Container port စာရင်းဖြစ်ပါသည်။
            - name: mysql
              # Port အမည် "mysql" ဖြစ်ပါသည်။
              containerPort: 3306
              # Container port 3306 ကို ဖွင့်ထားပါသည်။
          env:
          # Environment Variable များဖြစ်ပါသည်။
            - name: MYSQL_ROOT_PASSWORD
              # Root password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" အမည်ရှိ Secret မှ ယူပါမည်။
                  key: MYSQL_ROOT_PASSWORD
                  # "MYSQL_ROOT_PASSWORD" key ကို ယူသုံးပါမည်။
            - name: MYSQL_DATABASE
              # တည်ဆောက်မည့် Database အမည် variable ဖြစ်ပါသည်။
              value: wallet_db
              # Database အမည်ကို "wallet_db" ဟု သတ်မှတ်ပါသည်။
            - name: MYSQL_USER
              # တည်ဆောက်မည့် User အမည် variable ဖြစ်ပါသည်။
              value: wallet_app
              # User အမည်ကို "wallet_app" ဟု သတ်မှတ်ပါသည်။
            - name: MYSQL_PASSWORD
              # User password variable ဖြစ်ပါသည်။
              valueFrom:
              # ပြင်ပမှ တန်ဖိုးရယူပါမည်။
                secretKeyRef:
                # Secret ထဲမှ ရယူပါမည်။
                  name: wallet-secrets
                  # "wallet-secrets" ထဲမှ ယူပါမည်။
                  key: WALLET_DB_PASSWORD
                  # "WALLET_DB_PASSWORD" key ၏ တန်ဖိုးကို ယူသုံးပါမည်။
          volumeMounts:
          # Disk storage ချိတ်ဆက်မည့်အပိုင်းဖြစ်ပါသည်။
            - name: mysql-data
              # "mysql-data" volume ကို သုံးပါမည်။
              mountPath: /var/lib/mysql
              # "/var/lib/mysql" လမ်းကြောင်းတွင် ဒေတာသိမ်းဆည်းပါမည်။
          readinessProbe:
          # Traffic လက်ခံရန် အသင့်ဖြစ်မဖြစ် စစ်ဆေးခြင်းဖြစ်ပါသည်။
            exec:
            # Command run ၍ စစ်ဆေးပါမည်။
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
              # MySQL အသင့်ဖြစ်မဖြစ် ping ရိုက်စစ်ဆေးပါသည်။
            initialDelaySeconds: 15
            # ၁၅ စက္ကန့် စောင့်ဆိုင်းပြီးမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 5
            # ၅ စက္ကန့်တစ်ကြိမ် စစ်ဆေးပါမည်။
          livenessProbe:
          # Container အသက်ရှင်နေခြင်း ရှိမရှိ စစ်ဆေးခြင်းဖြစ်ပါသည်။
            exec:
            # Command run ၍ စစ်ဆေးပါမည်။
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
              # MySQL အလုပ်လုပ်နေခြင်း ရှိမရှိ ping ရိုက်စစ်ဆေးပါသည်။
            initialDelaySeconds: 30
            # ၃၀ စက္ကန့် စောင့်ဆိုင်းပြီးမှ စတင်စစ်ဆေးပါမည်။
            periodSeconds: 10
            # ၁၀ စက္ကန့်တစ်ကြိမ် စစ်ဆေးပါမည်။
  volumeClaimTemplates:
  # အမြဲတမ်း သိမ်းဆည်းမည့် Storage တောင်းခံသည့် ပုံစံငယ်ဖြစ်ပါသည်။
    - metadata:
      # Volume ၏ အချက်အလက်ဖြစ်ပါသည်။
        name: mysql-data
        # Volume အမည်ကို "mysql-data" ဟု ပေးထားပါသည်။
      spec:
      # Volume သတ်မှတ်ချက်ဖြစ်ပါသည်။
        accessModes: ["ReadWriteOnce"]
        # Node တစ်ခုမှသာ ဖတ်/ရေး လုပ်နိုင်သည့် mode ဖြစ်ပါသည်။
        resources:
        # Resource သတ်မှတ်ချက်ဖြစ်ပါသည်။
          requests:
          # တောင်းခံသည့် ပမာဏဖြစ်ပါသည်။
            storage: 5Gi
            # Storage 5Gi တောင်းခံထားပါသည်။
---
# Resource အသစ်တစ်ခု စတင်ရန် ပိုင်းခြားခြင်းဖြစ်ပါသည်။
