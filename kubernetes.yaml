# -------------------------
# RabbitMQ message broker
# -------------------------
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: digital-wallet
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  selector:
    app: rabbitmq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: digital-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: rabbitmq-data
          emptyDir: {}
---
# -------------------------
# Seq logging server
# -------------------------
apiVersion: v1
kind: Service
metadata:
  name: seq
  namespace: digital-wallet
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app: seq
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
  namespace: digital-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
        - name: seq
          image: datalust/seq:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SEQ_FIRSTRUN_ADMINPASSWORD
              value: "CHANGE_ME_SEQ_PASSWORD"
          volumeMounts:
            - name: seq-data
              mountPath: /data
      volumes:
        - name: seq-data
          emptyDir: {}
---
# -------------------------
# Identity Service
# -------------------------
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: digital-wallet
spec:
  ports:
    - name: http
      port: 8070
      targetPort: 8070
  selector:
    app: identity-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: digital-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: registry.example.com/digital-wallet/identity-service:latest
          ports:
            - name: http
              containerPort: 8070
          envFrom:
            - configMapRef:
                name: wallet-config
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8070"
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: JWT_SECRET
            - name: IDENTITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: IDENTITY_DB_PASSWORD
            - name: ConnectionStrings__IdentityDb
              value: "Server=mysql-identity;Port=3306;Database=identity_db;User=identity_app;Password=$(IDENTITY_DB_PASSWORD)"
            - name: RabbitMQ__UserName
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: RABBITMQ_USER
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: wallet-secrets
                  key: RABBITMQ_PASSWORD
---
